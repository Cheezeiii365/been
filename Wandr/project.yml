name: Wandr
options:
  bundleIdPrefix: com.wandr
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Wandr uses your location to help track your travels and suggest nearby places."

targets:
  Wandr:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wandr.app
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Wandr
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: 1
    resources:
      - path: Assets.xcassets
